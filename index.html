<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f4c81">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Reportes">
  <title>GENERADOR DE REPORTES TÉCNICOS</title>
  <script>
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('reporte_tecnico_tema') === 'dark' ? 'dark' : 'light'); }
    catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  </script>
  <style>
    :root {
      --primary: #0f4c81;
      --primary-hover: #0a365c;
      --secondary: #475569;
      --accent-whatsapp: #25d366;
      --accent-whatsapp-hover: #1ebc59;
      --danger: #dc2626;
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --bg-soft: #f8fafc;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --radius: 8px;
      --shadow: 0 4px 14px rgba(15, 76, 129, 0.08);
      --bg-input: #ffffff;
      --card-border: #e2e8f0;
      color-scheme: light;
    }

    html[data-theme="dark"] {
      --primary: #4d9de0;
      --primary-hover: #3b82c4;
      --secondary: #94a3b8;
      --bg-body: #0b1220;
      --bg-card: #151e30;
      --bg-soft: #1b263b;
      --bg-input: #1b263b;
      --border-color: #334155;
      --card-border: #263449;
      --text-main: #e2e8f0;
      --shadow: none;
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    body { background-color: var(--bg-body); color: var(--text-main); padding: 16px 12px 40px; line-height: 1.5; }
    .container { max-width: 640px; margin: 0 auto; }
    .top-bar { display: flex; justify-content: flex-end; }
    .theme-toggle { background: transparent; color: var(--secondary); border: 1px solid var(--border-color); border-radius: 6px; padding: 7px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    header { text-align: center; margin: 4px 0 20px; }
    header h1 { font-size: 1.3rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }
    header p { font-size: 0.8rem; color: var(--secondary); margin-top: 2px; }

    .card { background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; border: 1px solid var(--card-border); }
    .section-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--primary); border-bottom: 1px solid var(--border-color); padding-bottom: 6px; margin: 4px 0 14px; }
    .form-group { margin-bottom: 16px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 440px) { .row { grid-template-columns: 1fr; gap: 0; } }

    label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: var(--secondary); }
    .req { color: var(--danger); }

    input[type="text"], select, textarea {
      width: 100%; padding: 11px 13px; border: 1px solid var(--border-color); border-radius: 6px;
      font-size: 16px;
      color: var(--text-main); background-color: var(--bg-input); outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.15); }
    .invalid { border-color: var(--danger) !important; box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12) !important; }
    textarea { resize: vertical; min-height: 90px; line-height: 1.4; }

    .photo-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-file {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px;
      border: 2px dashed #94a3b8; border-radius: 6px; background: var(--bg-soft); color: var(--secondary);
      cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.2s ease; margin-bottom: 0; text-align: center;
    }
    .btn-file:hover { border-color: var(--primary); color: var(--primary); }
    input[type="file"] { display: none; }
    .photo-count { font-size: 0.8rem; color: var(--secondary); margin-top: 8px; }

    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 10px; margin-top: 10px; }
    .photo-item { position: relative; width: 100%; height: 85px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border-color); background-color: #e2e8f0; }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-item button {
      position: absolute; top: 4px; right: 4px; background: rgba(220, 38, 38, 0.92); border: none; color: white;
      border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: bold; cursor: pointer;
    }

    .btn {
      width: 100%; padding: 13px; border: none; border-radius: 6px; font-size: 0.92rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 8px; transition: background-color 0.2s, transform 0.1s; text-decoration: none;
    }
    .btn:active { transform: scale(0.99); }
    .btn-primary { background-color: var(--primary); color: #fff; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-whatsapp { background-color: var(--accent-whatsapp); color: #fff; }
    .btn-whatsapp:hover { background-color: var(--accent-whatsapp-hover); }
    .btn-copy { background-color: #334155; color: #fff; }
    .btn-copy:hover { background-color: #1e293b; }
    .btn-outline { background: transparent; color: var(--accent-whatsapp-hover); border: 2px solid var(--accent-whatsapp); }
    .btn-outline:hover { background-color: rgba(37, 211, 102, .12); }
    .btn-reset { background-color: transparent; color: #64748b; border: 1px solid var(--border-color); margin-top: 10px; }
    .btn-reset:hover { background-color: rgba(100,116,139,.15); }

    #reportPreviewSection { display: none; }
    .report-output {
      background: var(--bg-soft); border: 1px solid var(--border-color); border-radius: 6px; padding: 16px;
      font-size: 0.92rem; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-main); margin-bottom: 16px;
    }
    .actions-grid { display: flex; flex-direction: column; gap: 10px; }
    .hint { font-size: 0.78rem; color: var(--secondary); text-align: center; margin-top: 4px; }
    .status { font-size: 0.76rem; color: var(--secondary); text-align: center; overflow-wrap: anywhere; }
    .draft-note { font-size: 0.75rem; color: var(--secondary); text-align: center; margin-top: 12px; }

    #toast {
      visibility: hidden; opacity: 0; min-width: 250px; max-width: 90vw; background-color: #1e293b; color: #fff; text-align: center;
      border-radius: 6px; padding: 12px 16px; position: fixed; z-index: 1000; bottom: 25px; left: 50%;
      transform: translateX(-50%); font-size: 0.9rem; box-shadow: 0 4px 12px rgba(0,0,0,.25); transition: opacity .25s;
    }
    #toast.show { visibility: visible; opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar"><button type="button" class="theme-toggle" id="themeToggle">Modo oscuro</button></div>
    <header>
      <h1>Generador de Reportes Técnicos</h1>
      <p>Mantenimiento de equipos médicos</p>
    </header>

    <div class="card">
      <form id="reportForm" autocomplete="off" novalidate>
        <div class="section-title">Datos generales</div>

        <div class="form-group">
          <label for="servicio">1. Servicio: <span class="req">*</span></label>
          <input type="text" id="servicio" placeholder="Ej. UCI Adultos, Quirófano 2, Imagenología">
        </div>

        <div class="section-title">Identificación del equipo</div>

        <div class="form-group">
          <label for="equipo">2. Equipo: <span class="req">*</span></label>
          <input type="text" id="equipo" placeholder="Ej. Monitor de Signos Vitales, Ventilador Mecánico">
        </div>

        <div class="row">
          <div class="form-group">
            <label for="marca">3. Marca:</label>
            <input type="text" id="marca" placeholder="Ej. Philips, Dräger, Mindray">
          </div>
          <div class="form-group">
            <label for="modelo">4. Modelo:</label>
            <input type="text" id="modelo" placeholder="Ej. IntelliVue MX450">
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="serial">5. Serial:</label>
            <input type="text" id="serial" placeholder="Ej. SN-784920">
          </div>
          <div class="form-group">
            <label for="bienNacional">6. Bien Nacional:</label>
            <input type="text" id="bienNacional" placeholder="Ej. BN-003912">
          </div>
        </div>

        <div class="section-title">Intervención</div>

        <div class="form-group">
          <label for="fallas">7. Fallas reportadas:</label>
          <textarea id="fallas" placeholder="Describa detalladamente el problema o falla reportada por el personal asistencial..."></textarea>
        </div>

        <div class="form-group">
          <label for="trabajos">8. Trabajos realizados:</label>
          <textarea id="trabajos" placeholder="Detalle las tareas de inspección, cambio de partes, calibración o pruebas ejecutadas..."></textarea>
        </div>

        <div class="form-group">
          <label for="estatus">9. Estatus del equipo:</label>
          <select id="estatus">
            <option value="Operativo">Operativo</option>
            <option value="Operativo con observaciones">Operativo con observaciones</option>
            <option value="Fuera de servicio">Fuera de servicio</option>
            <option value="Pendiente por repuestos">Pendiente por repuestos</option>
            <option value="Pendiente por evaluación técnica">Pendiente por evaluación técnica</option>
          </select>
        </div>

        <div class="form-group">
          <label for="recomendaciones">Observaciones / recomendaciones (opcional):</label>
          <textarea id="recomendaciones" style="min-height:70px" placeholder="Solo aparece en el reporte si se llena."></textarea>
        </div>

        <div class="section-title">Fotografías</div>

        <div class="form-group">
          <div class="photo-actions">
            <label for="cameraInput" class="btn-file"><span>📷 Tomar foto</span></label>
            <label for="photoInput" class="btn-file"><span>🖼️ Galería</span></label>
          </div>
          <!-- capture="environment" abre directamente la cámara trasera en el teléfono -->
          <input type="file" id="cameraInput" accept="image/*" capture="environment">
          <input type="file" id="photoInput" accept="image/*" multiple>
          <div class="photo-grid" id="photoGrid"></div>
          <div class="photo-count" id="photoCount"></div>
        </div>

        <button type="button" class="btn btn-primary" id="btnGenerar">Generar reporte</button>
        <button type="button" class="btn btn-reset" id="btnNuevo">Nuevo reporte</button>
      </form>
    </div>

    <div class="card" id="reportPreviewSection">
      <label style="color: var(--primary); margin-bottom: 10px;">REPORTE GENERADO:</label>
      <div class="report-output" id="reportOutput"></div>
      <div class="actions-grid">
        <a class="btn btn-whatsapp" id="btnWhatsApp" href="https://wa.me/" target="_blank" rel="noopener">Compartir por WhatsApp</a>
        <a class="btn btn-outline" id="btnWhatsAppTexto" href="https://wa.me/" target="_blank" rel="noopener">Enviar solo texto a WhatsApp</a>
        <button type="button" class="btn btn-copy" id="btnCopiar">Copiar reporte</button>
        <p class="hint" id="shareHint"></p>
        <p class="status" id="shareStatus"></p>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    // ---------- Estado ----------
    let photos = [];             // [{ file, url }]
    let shareLocked = false;     // antirrebote por TIEMPO
    let toastTimer = null;
    let photoSeq = 0;            // para dar nombre único a cada foto
    let photoQueue = Promise.resolve();   // procesa las fotos de una en una, en orden

    const $ = (id) => document.getElementById(id);
    const FIELDS = ['servicio','equipo','marca','modelo','serial','bienNacional','fallas','trabajos','estatus','recomendaciones'];
    const DRAFT_KEY = 'reporte_tecnico_borrador_v4';

    // ---------- Utilidades ----------
    function showToast(message, ms = 2600) {
      const t = $('toast');
      t.textContent = message;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), ms);
    }

    const val = (id) => $(id).value.trim();
    const previewVisible = () => $('reportPreviewSection').style.display === 'block';

    // ---------- Borrador anterior (ya no se guarda) ----------
    function clearDraft() {
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    }

    FIELDS.forEach(f => {
      const onChange = () => {
        $(f).classList.remove('invalid');
        if (previewVisible()) refreshReport();   // la vista previa y el enlace de WhatsApp siempre están al día
      };
      $(f).addEventListener('input', onChange);
      $(f).addEventListener('change', onChange);
    });

    // ---------- Fotos (con compresión) ----------
    // Copia la foto a memoria: así no depende del archivo temporal de la cámara/galería,
    // que el teléfono puede dejar de ofrecer cuando se va a compartir.
    async function toMemoryFile(file) {
      try {
        const buf = await file.arrayBuffer();
        return new File([buf], file.name || 'foto.jpg', { type: file.type || 'image/jpeg', lastModified: Date.now() });
      } catch (e) {
        return file;
      }
    }

    // Reduce la foto SIN decodificarla a tamaño completo (una foto de cámara de 12-50 MP
    // ocupa cientos de MB al decodificarse y causa "memoria insuficiente" en el teléfono).
    function drawToJpeg(source, w, h, quality) {
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(source, 0, 0, w, h);
      return new Promise(res => canvas.toBlob(b => { canvas.width = canvas.height = 0; res(b); }, 'image/jpeg', quality));
    }

    async function viaBitmap(file, maxSide, quality) {
      // El navegador decodifica directamente a tamaño reducido (no carga la imagen completa).
      const bmp = await createImageBitmap(file, { resizeWidth: maxSide, resizeQuality: 'medium', imageOrientation: 'from-image' });
      try { return await drawToJpeg(bmp, bmp.width, bmp.height, quality); }
      finally { if (bmp.close) bmp.close(); }
    }

    async function viaImgElement(file, maxSide, quality) {
      const url = URL.createObjectURL(file);
      try {
        const img = new Image();
        img.src = url;
        await img.decode();
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        return await drawToJpeg(img, Math.round(img.naturalWidth * scale), Math.round(img.naturalHeight * scale), quality);
      } finally { URL.revokeObjectURL(url); }
    }

    async function compressImage(file, maxSide = 1280, quality = 0.78) {
      // Las fotos pequeñas no necesitan reducirse (y así no se decodifican).
      if (file.size < 500 * 1024) return toMemoryFile(file);
      let blob = null;
      try { if (window.createImageBitmap) blob = await viaBitmap(file, maxSide, quality); } catch (e) { blob = null; }
      if (!blob) { try { blob = await viaImgElement(file, maxSide, quality); } catch (e) { blob = null; } }
      if (!blob || blob.size >= file.size) return toMemoryFile(file);
      const base = (file.name || 'foto').replace(/\.[^.]+$/, '');
      return new File([blob], base + '.jpg', { type: 'image/jpeg', lastModified: Date.now() });
    }

    // Las cámaras suelen nombrar todo como "image.jpg": se renombra para que no haya nombres repetidos al compartir.
    function uniqueName(file) {
      const t = (file.type || '').toLowerCase();
      const ext = t.includes('png') ? 'png' : t.includes('webp') ? 'webp' : t.includes('heic') ? 'heic' : t.includes('heif') ? 'heif' : 'jpg';
      photoSeq++;
      return 'foto_' + String(photoSeq).padStart(2, '0') + '.' + ext;
    }

    // Punto único de entrada para fotos (cámara y galería). Se encolan para conservar el orden.
    function addPhotoFiles(files) {
      if (!files.length) return;
      showToast('Procesando fotografías...', 1500);
      photoQueue = photoQueue.then(async () => {
        for (const f of files) {
          const small = await compressImage(f);
          const named = new File([small], uniqueName(small), { type: small.type || 'image/jpeg', lastModified: Date.now() });
          photos.push({ file: named, url: URL.createObjectURL(named) });
        }
        renderPhotoGrid();
      }).catch(() => showToast('No se pudo procesar una fotografía'));
    }

    function onPhotoInput(e) {
      const files = Array.from(e.target.files || []);
      e.target.value = '';      // permite volver a elegir/tomar la misma foto
      addPhotoFiles(files);
    }
    $('photoInput').addEventListener('change', onPhotoInput);
    $('cameraInput').addEventListener('change', onPhotoInput);

    function renderPhotoGrid() {
      const grid = $('photoGrid');
      grid.innerHTML = '';
      photos.forEach((p, index) => {
        const item = document.createElement('div');
        item.className = 'photo-item';

        const img = document.createElement('img');
        img.src = p.url;
        img.alt = 'Foto ' + (index + 1);

        const del = document.createElement('button');
        del.type = 'button';
        del.innerHTML = '&times;';
        del.setAttribute('aria-label', 'Eliminar fotografía ' + (index + 1));
        del.onclick = () => {
          URL.revokeObjectURL(p.url);
          photos.splice(index, 1);
          renderPhotoGrid();
        };

        item.appendChild(img);
        item.appendChild(del);
        grid.appendChild(item);
      });
      const n = photos.length;
      $('photoCount').textContent = n ? `${n} fotografía${n === 1 ? '' : 's'} adjunta${n === 1 ? '' : 's'}` : '';
      updateShareHint();
    }

    function clearPhotos() {
      photos.forEach(p => URL.revokeObjectURL(p.url));
      photos = [];
      photoSeq = 0;
      renderPhotoGrid();
    }

    // ---------- Reporte (formato original) ----------
    function buildReport() {
      const servicio = val('servicio');
      const equipo = val('equipo');
      const marca = val('marca');
      const modelo = val('modelo');
      const serial = val('serial');
      const bienNacional = val('bienNacional');
      const fallas = val('fallas');
      const trabajos = val('trabajos');
      const estatus = $('estatus').value;
      const rec = val('recomendaciones');

      let txt =
`REPORTE DE TRABAJO DIARIO

Servicio: ${servicio}
Equipo: ${equipo}
Marca: ${marca}
Modelo: ${modelo}
Serial: ${serial}
Bien Nacional: ${bienNacional}
Fallas reportadas:
${fallas}
Trabajos realizados:
${trabajos}
Estatus del equipo: ${estatus}`;

      // Solo si se llenó el campo opcional.
      if (rec) txt += `\nObservaciones / recomendaciones:\n${rec}`;
      return txt;
    }

    const waUrl = (text) => 'https://wa.me/?text=' + encodeURIComponent(text);

    // Regenera el texto desde el formulario y deja el enlace de WhatsApp actualizado.
    function refreshReport() {
      const text = buildReport();
      $('reportOutput').textContent = text;
      $('btnWhatsAppTexto').href = waUrl(text);
      return text;
    }

    function validate() {
      let ok = true;
      ['servicio', 'equipo'].forEach(id => {
        if (!val(id)) { $(id).classList.add('invalid'); ok = false; }
      });
      if (!ok) {
        showToast('Complete los campos obligatorios (*)');
        const first = document.querySelector('.invalid');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return ok;
    }

    $('btnGenerar').addEventListener('click', () => {
      if (!validate()) return;
      refreshReport();
      updateShareHint();
      $('reportPreviewSection').style.display = 'block';
      $('reportPreviewSection').scrollIntoView({ behavior: 'auto', block: 'start' });
    });

    function updateShareHint() {
      $('shareHint').textContent = photos.length
        ? 'Con fotos: se usa el menú de compartir del teléfono. Si no responde, use «Enviar solo texto».'
        : 'Sin fotos: se abre WhatsApp directamente con el texto.';
    }

    // ---------- Copiar ----------
    $('btnCopiar').addEventListener('click', () => {
      const text = refreshReport();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast('Reporte copiado correctamente'))
          .catch(() => fallbackCopyText(text));
      } else {
        fallbackCopyText(text);
      }
    });

    function fallbackCopyText(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy') ? showToast('Reporte copiado correctamente') : showToast('No se pudo copiar automáticamente');
      } catch (e) {
        showToast('No se pudo copiar automáticamente');
      }
      document.body.removeChild(ta);
    }

    // ---------- WhatsApp ----------
    function lockShare(ms = 1200) {
      shareLocked = true;
      setTimeout(() => { shareLocked = false; }, ms);
    }

    // Abre WhatsApp con el texto en una pestaña nueva (así la página conserva las fotos).
    // Se hace con un enlace real (como el botón de solo texto), que es lo que funciona en el teléfono.
    function openWhatsAppText(text) {
      const a = document.createElement('a');
      a.href = waUrl(text);
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Enlace "solo texto": es un <a> real, el toque del usuario lo abre directamente.
    $('btnWhatsAppTexto').addEventListener('click', (e) => {
      if (shareLocked) { e.preventDefault(); return; }
      lockShare();
      $('btnWhatsAppTexto').href = waUrl(refreshReport());
    });

    let shareCount = 0;

    function setStatus(msg) { $('shareStatus').textContent = msg; }

    function shareFailed(err, text, n) {
      const name = (err && err.name) || 'error';
      if (name === 'AbortError') {
        setStatus('Toque ' + n + ': el menú de compartir se cerró o se canceló.');
        return;
      }
      console.warn('Fallo al compartir:', err);
      setStatus('Toque ' + n + ': error al compartir (' + name + (err && err.message ? ': ' + err.message : '') + '). Se abrió WhatsApp con el texto.');
      showToast('No se pudo abrir el menú de compartir (' + name + '). Abriendo WhatsApp con el texto...', 4000);
      openWhatsAppText(text);
    }

    $('btnWhatsApp').addEventListener('click', (e) => {
      shareCount++;
      const n = shareCount;
      if (shareLocked) { e.preventDefault(); return; }
      lockShare();

      const text = refreshReport();
      $('btnWhatsApp').href = waUrl(text);

      // Sin fotos: el propio enlace abre WhatsApp (igual que "solo texto").
      if (!photos.length) {
        setStatus('Toque ' + n + ': sin fotos, abriendo WhatsApp con el texto.');
        return;
      }

      // Con fotos: se cancela el enlace y se usa el menú de compartir.
      e.preventDefault();

      if (typeof navigator.share !== 'function' || typeof navigator.canShare !== 'function') {
        setStatus('Toque ' + n + ': este navegador no tiene menú de compartir (¿página abierta como archivo local?). Se abrió WhatsApp con el texto.');
        showToast('Este navegador no puede adjuntar fotos. Se envía solo el texto.', 3500);
        openWhatsAppText(text);
        return;
      }

      // Archivos nuevos en cada intento, para no reutilizar objetos ya consumidos por un envío anterior.
      const files = photos.map(ph => new File([ph.file], ph.file.name, { type: ph.file.type, lastModified: Date.now() }));
      const data = { text, files };

      let can = false;
      try { can = navigator.canShare(data); } catch (err) {}
      if (!can) {
        setStatus('Toque ' + n + ': el navegador no permite compartir estas fotos. Se abrió WhatsApp con el texto.');
        showToast('Este navegador no puede adjuntar fotos. Se envía solo el texto.', 3500);
        openWhatsAppText(text);
        return;
      }

      setStatus('Toque ' + n + ': abriendo el menú de compartir...');
      let p;
      try {
        p = navigator.share(data);               // dentro del gesto del usuario
      } catch (err) {
        shareFailed(err, text, n);
        return;
      }
      Promise.resolve(p)
        .then(() => setStatus('Toque ' + n + ': compartido correctamente.'))
        .catch(err => shareFailed(err, text, n));
    });

    // ---------- Nuevo reporte ----------
    $('btnNuevo').addEventListener('click', () => {
      const tieneDatos = FIELDS.some(f => f !== 'estatus' && val(f) !== '') || photos.length > 0;
      if (tieneDatos && !confirm('¿Desea iniciar un nuevo reporte? Se borrarán todos los datos y fotos ingresadas.')) return;

      $('reportForm').reset();
      FIELDS.forEach(f => $(f).classList.remove('invalid'));
      clearPhotos();
      clearDraft();
      setStatus('');           // limpia mensajes del reporte anterior
      shareCount = 0;
      $('reportPreviewSection').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ---------- Tema (claro por defecto) ----------
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      $('themeToggle').textContent = theme === 'dark' ? 'Modo claro' : 'Modo oscuro';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b1220' : '#0f4c81');
      try { localStorage.setItem('reporte_tecnico_tema', theme); } catch (e) {}
    }
    $('themeToggle').addEventListener('click', () => {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

    // ---------- Inicio ----------
    clearDraft();   // cada vez que se abre el archivo empieza un reporte nuevo
    updateShareHint();

    // ---------- PWA: service worker (necesario para poder instalar la app) ----------
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW no registrado:', err));
      });
    }
  </script>
</body>
</html>
